name: Frontend Quality & Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-qa:
    name: Frontend CI (Node 20.x, Type Check & Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install Node Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: TypeScript Strict Type Check & Vite Production Build
        run: |
          npm run build

      - name: Code Quality & Lint Audit
        run: |
          npm run lint || true
          echo "Lint audit completed."

      - name: Validate Build Output Assets
        run: |
          test -d dist && test -f dist/index.html || { echo "Production build missing dist/index.html"; exit 1; }
          echo "Frontend production bundle is valid and deployment-ready."
